<!DOCTYPE html>
<html>
<head>
  <title>Driving Distance Checker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 50px auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #1557b0; }
    #result { margin-top: 20px; padding: 15px; background: #f1f3f4; border-radius: 6px; font-size: 18px; }
  </style>
</head>
<body>

  <h2>Driving Distance Checker</h2>
  <input id="origin" placeholder="Point A (e.g., King Fahd Rd, Riyadh)" />
  <input id="destination" placeholder="Point B (e.g., King Khalid Airport, Riyadh)" />
  <button onclick="checkDistance()">Calculate Distance</button>

  <div id="result">Enter two places and click Calculate.</div>

  <script>
    const API_KEY = "AIzaSyCaYDUOagdiPnL2ZR536Xyvul-djdBSsG4";

    async function checkDistance() {
      const origin = document.getElementById("origin").value;
      const destination = document.getElementById("destination").value;
      const resultBox = document.getElementById("result");

      if (!origin || !destination) {
        resultBox.innerText = "Please enter both Point A and Point B.";
        return;
      }

      resultBox.innerText = "Calculating...";

      try {
        const response = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Goog-Api-Key": API_KEY,
            "X-Goog-FieldMask": "routes.distanceMeters,routes.duration"
          },
          body: JSON.stringify({
            origin: { address: origin },
            destination: { address: destination },
            travelMode: "DRIVE",
            routingPreference: "TRAFFIC_AWARE"
          })
        });

        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const km = (data.routes[0].distanceMeters / 1000).toFixed(1);
          const mins = Math.round(parseInt(data.routes[0].duration) / 60);
          resultBox.innerHTML = `<strong>Distance:</strong> ${km} km<br><strong>Drive Time:</strong> ${mins} mins`;
        } else {
          resultBox.innerText = "Could not find a route. Try more specific addresses.";
        }
      } catch (err) {
        resultBox.innerText = "Error connecting to Google Maps. Check your API key.";
      }
    }
  </script>

</body>
</html>
